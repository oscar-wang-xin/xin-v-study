<!DOCTYPE html>
<!--
  视频摘要索引页模板 — xin-v-study  (v4 科技立体版: 8 套配色 x 浅深主题)

  由 scripts/update_index.py 生成, 只需替换一处数据占位:
    /*__CARD_DATA__*/[]   ->   卡片 JSON 数组
  !! 该标记必须原样保留, 不可加空格或换行。

  卡片数据结构:
    { ts, title, desc, source, date, duration, file }
    file 为同目录下的 html 文件名, 脚本负责 URL 编码后作为链接。

  主题: data-scheme = mecha|business|china|ali|grape|mint|ink|porcelain,
        data-theme  = light|dark。与摘要页共享 localStorage 键 xvs-scheme / xvs-theme。
  本模板不引用任何外部资源, 搜索与排序均为纯前端实现。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频摘要库</title>
<script>
(function () {
  var s = null, t = null;
  try { s = localStorage.getItem('xvs-scheme'); t = localStorage.getItem('xvs-theme'); } catch (e) {}
  var valid = ['mecha','business','china','ali','grape','mint','ink','porcelain'];
  if (valid.indexOf(s) < 0) s = 'mint';
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  var r = document.documentElement;
  r.setAttribute('data-scheme', s);
  r.setAttribute('data-theme', t);
})();
</script>
<style>
  /* ============ 结构色: 随明暗切换 ============ */
  [data-theme="light"] {
    --canvas:#eceff2; --sheet:#ffffff; --field:#f5f6f8;
    --ink:#14171c; --ink-soft:#6b717b; --rule:#e3e6ea;
    --grid-line:rgba(20,23,28,.035);
    --accent:var(--a-lt); --accent-soft:var(--a-soft-lt);
    --panel-bg:#14171c; --panel-text:#f5f7f9;
    --shadow:0 1px 2px rgba(20,23,28,.05), 0 10px 26px rgba(20,23,28,.07), 0 30px 60px rgba(20,23,28,.05);
    --shadow-sm:0 2px 8px rgba(20,23,28,.05);
  }
  [data-theme="dark"] {
    --canvas:#0c0e12; --sheet:#161920; --field:#1e222a;
    --ink:#ebedf1; --ink-soft:#9aa1ad; --rule:#2b3039;
    --grid-line:rgba(235,237,241,.035);
    --accent:var(--a-dk); --accent-soft:var(--a-soft-dk);
    --panel-bg:#0a0c10; --panel-text:#f4f6f9;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4), 0 32px 64px rgba(0,0,0,.28);
    --shadow-sm:0 2px 10px rgba(0,0,0,.28);
  }

  /* ============ 8 套配色 ============ */
  :root {
    --a-lt:#0a8f6a; --a-dk:#5fe0b3; --a-soft-lt:#e6f7f1; --a-soft-dk:#16352d; --a-rgb:10,143,106;
    --font-body:"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    --font-mono:ui-monospace,"SF Mono",Consolas,monospace;
  }
  [data-scheme="mecha"]     { --a-lt:#486273; --a-dk:#9db9cc; --a-soft-lt:#eaf0f4; --a-soft-dk:#222e37; --a-rgb:72,98,115; }
  [data-scheme="business"]  { --a-lt:#1d4ed8; --a-dk:#87a9ff; --a-soft-lt:#eaf0ff; --a-soft-dk:#1a2748; --a-rgb:29,78,216; }
  [data-scheme="china"]     { --a-lt:#c8102e; --a-dk:#ff6277; --a-soft-lt:#fdecf0; --a-soft-dk:#3a1720; --a-rgb:200,16,46; }
  [data-scheme="ali"]       { --a-lt:#e85900; --a-dk:#ffa257; --a-soft-lt:#fff0e4; --a-soft-dk:#3a2516; --a-rgb:232,89,0; }
  [data-scheme="grape"]     { --a-lt:#6d28d9; --a-dk:#bda3ff; --a-soft-lt:#f2ecff; --a-soft-dk:#2b2045; --a-rgb:109,40,217; }
  [data-scheme="mint"]      { --a-lt:#0a8f6a; --a-dk:#5fe0b3; --a-soft-lt:#e6f7f1; --a-soft-dk:#16352d; --a-rgb:10,143,106; }
  [data-scheme="ink"]       { --a-lt:#30353c; --a-dk:#e6e9ee; --a-soft-lt:#eceef1; --a-soft-dk:#252a31; --a-rgb:90,98,110; }
  [data-scheme="porcelain"] { --a-lt:#1c6b8c; --a-dk:#74bcd8; --a-soft-lt:#e7f3f8; --a-soft-dk:#15303c; --a-rgb:28,107,140; }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 1rem;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    transition: background 260ms ease, color 260ms ease;
  }
  body::before {
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(120% 80% at 50% 0%, #000 0%, transparent 78%);
    mask-image:radial-gradient(120% 80% at 50% 0%, #000 0%, transparent 78%);
  }
  body::after {
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(760px 440px at 8% -10%, rgba(var(--a-rgb),.11), transparent 62%),
      radial-gradient(620px 400px at 96% 2%, rgba(var(--a-rgb),.07), transparent 64%);
  }
  main, footer { position:relative; z-index:1; }

  /* ---------- 顶部滚动进度 ---------- */
  .topbar { position:fixed; top:0; left:0; right:0; height:3px; z-index:40; }
  .topbar-fill {
    height:100%; width:0;
    background:linear-gradient(90deg, var(--accent), rgba(var(--a-rgb),.35));
    box-shadow:0 0 12px rgba(var(--a-rgb),.5);
    transition:width 90ms linear;
  }

  /* ---------- 工具组 ---------- */
  .tools { position:fixed; top:16px; right:16px; z-index:50; display:flex; align-items:flex-start; gap:.5rem; }
  .tool-btn {
    display:inline-flex; align-items:center; gap:.45rem;
    font:600 .8125rem/1 var(--font-body); color:var(--ink);
    background:var(--sheet); border:1px solid var(--rule); border-radius:999px;
    padding:.55rem .9rem; cursor:pointer; box-shadow:var(--shadow-sm);
    transition:border-color 200ms ease, color 200ms ease, transform 200ms ease, box-shadow 200ms ease;
  }
  .tool-btn:hover { border-color:var(--accent); color:var(--accent); transform:translateY(-2px); box-shadow:0 8px 20px rgba(var(--a-rgb),.16); }
  .tool-btn svg { width:15px; height:15px; display:block; flex:none; }
  .tool-btn.icon-only { padding:.55rem; }
  .tool-btn .ico-sun, .tool-btn .ico-moon { display:none; }
  [data-theme="light"] #themeToggle .ico-moon { display:block; }
  [data-theme="dark"]  #themeToggle .ico-sun  { display:block; }
  .scheme-name { font-family:var(--font-mono); letter-spacing:.04em; }
  .scheme-wrap { position:relative; }
  .scheme-panel {
    position:absolute; top:calc(100% + 10px); right:0; width:268px; padding:.85rem;
    background:var(--sheet); border:1px solid var(--rule); border-radius:18px; box-shadow:var(--shadow);
    transform-origin:top right; transform:scale(.94) translateY(-6px); opacity:0; visibility:hidden;
    transition:opacity 180ms ease, transform 180ms ease, visibility 180ms;
  }
  .scheme-panel.open { opacity:1; visibility:visible; transform:none; }
  .sp-label { font:700 .6875rem/1 var(--font-mono); letter-spacing:.16em; color:var(--ink-soft); margin:.2rem .3rem .7rem; }
  .scheme-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.4rem; }
  .scheme-opt {
    display:flex; align-items:center; gap:.5rem;
    font:600 .8rem/1 var(--font-body); color:var(--ink);
    background:var(--field); border:1px solid transparent; border-radius:10px;
    padding:.55rem .6rem; cursor:pointer; text-align:left;
    transition:border-color 160ms ease, background 160ms ease, transform 160ms ease;
  }
  .scheme-opt:hover { transform:translateY(-1px); border-color:var(--rule); }
  .scheme-opt[aria-pressed="true"] { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .scheme-opt i {
    width:15px; height:15px; border-radius:5px; flex:none;
    box-shadow:inset 0 1px 2px rgba(255,255,255,.35), 0 1px 3px rgba(0,0,0,.16);
  }
  [data-scheme-opt="mecha"] i     { background:#486273; }
  [data-scheme-opt="business"] i  { background:#1d4ed8; }
  [data-scheme-opt="china"] i     { background:#c8102e; }
  [data-scheme-opt="ali"] i       { background:#e85900; }
  [data-scheme-opt="grape"] i     { background:#6d28d9; }
  [data-scheme-opt="mint"] i      { background:#0a8f6a; }
  [data-scheme-opt="ink"] i       { background:#30353c; }
  [data-scheme-opt="porcelain"] i { background:#1c6b8c; }

  /* ---------- 主卡 ---------- */
  .sheet {
    max-width:1080px; margin:clamp(1.1rem,3vw,2.2rem) auto clamp(2rem,5vw,3.5rem);
    background:var(--sheet); border:1px solid var(--rule); border-radius:24px;
    box-shadow:var(--shadow);
    padding:clamp(1.75rem,5vw,3.25rem) clamp(1.4rem,5vw,3rem) clamp(2rem,5vw,2.75rem);
    overflow:hidden; position:relative;
    transition:background 260ms ease, border-color 260ms ease;
  }
  .sheet::before {
    content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--accent), rgba(var(--a-rgb),.18) 55%, transparent);
  }
  .sheet::after {
    content:""; position:absolute; top:3px; right:0; width:220px; height:220px;
    background:radial-gradient(circle at 100% 0%, rgba(var(--a-rgb),.10), transparent 70%); pointer-events:none;
  }

  /* ---------- 头部 ---------- */
  .hero-line { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1.1rem; }
  .kicker {
    display:inline-block;
    background:linear-gradient(135deg, var(--accent), rgba(var(--a-rgb),.72));
    color:#fff; font-family:var(--font-mono); font-size:.75rem; font-weight:700;
    letter-spacing:.14em; border-radius:999px; padding:.4rem .95rem;
    box-shadow:0 4px 14px rgba(var(--a-rgb),.24);
  }
  .stamp { font-family:var(--font-mono); font-size:.78rem; letter-spacing:.08em; color:var(--ink-soft); }
  h1 { font-size:clamp(2rem,5.4vw,3.2rem); line-height:1.16; letter-spacing:-.02em; font-weight:700; margin:0 0 .5rem; }
  .subtitle { color:var(--ink-soft); margin:0; font-size:.9375rem; }

  /* ---------- 工具栏 ---------- */
  .toolbar {
    display:flex; flex-wrap:wrap; align-items:flex-end; gap:1rem 1.5rem;
    margin:clamp(1.6rem,4vw,2.4rem) 0 1.6rem; padding:1.1rem 1.2rem;
    background:var(--field); border:1px solid var(--rule); border-radius:16px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
  }
  [data-theme="dark"] .toolbar { box-shadow:inset 0 1px 0 rgba(255,255,255,.04); }
  .field { display:flex; flex-direction:column; gap:.4rem; }
  .field label { font-family:var(--font-mono); font-size:.6875rem; letter-spacing:.14em; color:var(--ink-soft); text-transform:uppercase; }
  .search-wrap { flex:1 1 260px; min-width:220px; }
  #search {
    width:100%; border:1px solid var(--rule); background:var(--sheet); color:var(--ink);
    border-radius:999px; font:inherit; font-size:.9375rem; padding:.55rem 1.1rem; outline:none;
    transition:border-color 200ms ease, box-shadow 200ms ease;
  }
  #search::placeholder { color:var(--ink-soft); }
  #search:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(var(--a-rgb),.12); }
  .controls { display:flex; align-items:flex-end; gap:.7rem; }
  select, .dir-btn {
    font:inherit; font-size:.875rem; font-weight:600; color:var(--ink); background:var(--sheet);
    border:1px solid var(--rule); border-radius:999px; padding:.5rem 1rem; cursor:pointer;
    transition:border-color 200ms ease, color 200ms ease, background 200ms ease, transform 200ms ease;
  }
  select:hover, .dir-btn:hover { border-color:var(--accent); color:var(--accent); transform:translateY(-1px); }
  select:focus-visible, .dir-btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .count { margin-left:auto; font-size:.8125rem; color:var(--ink-soft); font-family:var(--font-mono); }

  /* ---------- 卡片网格 ---------- */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1.1rem; }
  .card {
    position:relative; display:flex; flex-direction:column; min-height:210px;
    padding:1.5rem 1.5rem 1.2rem; text-decoration:none; color:inherit; overflow:hidden;
    background:linear-gradient(155deg, var(--sheet) 0%, var(--sheet) 70%, var(--field) 100%);
    border:1px solid var(--rule); border-radius:18px; box-shadow:var(--shadow-sm);
    transition:border-color 260ms cubic-bezier(.2,.7,.2,1),
               transform 260ms cubic-bezier(.2,.7,.2,1),
               box-shadow 260ms cubic-bezier(.2,.7,.2,1);
  }
  .card::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--accent); transform:scaleY(0); transform-origin:top;
    transition:transform 260ms cubic-bezier(.2,.7,.2,1);
  }
  .card:hover {
    border-color:rgba(var(--a-rgb),.5);
    transform:translateY(-6px);
    box-shadow:0 18px 40px rgba(var(--a-rgb),.15), 0 2px 6px rgba(0,0,0,.06);
  }
  .card:hover::before { transform:scaleY(1); }
  .card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .card-index {
    position:absolute; right:1rem; top:.4rem;
    font-family:var(--font-mono); font-size:3.4rem; line-height:1; font-weight:700;
    letter-spacing:-.05em;
    background:linear-gradient(145deg, var(--accent), rgba(var(--a-rgb),.3));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    opacity:.2; pointer-events:none;
    transition:opacity 260ms ease, transform 260ms ease;
  }
  .card:hover .card-index { opacity:.34; transform:translateY(-3px); }
  .card h2 {
    position:relative; font-size:1.22rem; line-height:1.45; font-weight:700; color:var(--ink);
    margin:0 0 .7rem; padding-right:1.9rem; transition:color 200ms ease;
  }
  .card:hover h2 { color:var(--accent); }
  .card .desc {
    font-size:.9rem; color:var(--ink-soft); line-height:1.65; margin:0 0 1.2rem;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card .foot { margin-top:auto; display:flex; flex-wrap:wrap; gap:.4rem; }
  .card .foot span {
    font-family:var(--font-mono); font-size:.7rem; letter-spacing:.02em; color:var(--ink-soft);
    background:var(--sheet); border:1px solid var(--rule); border-radius:999px;
    padding:.28rem .7rem; max-width:100%; overflow-wrap:anywhere;
  }
  .card .foot .date-mark { color:var(--accent); background:var(--accent-soft); border-color:transparent; font-weight:700; }

  /* ---------- 空状态 / 底部 ---------- */
  .empty { padding:4rem 1rem; text-align:center; color:var(--ink-soft); background:var(--field); border:1px dashed var(--rule); border-radius:16px; }
  .empty p { margin:0; }
  footer { margin-top:clamp(2.4rem,6vw,3.6rem); padding-top:1.3rem; border-top:1px solid var(--rule); font-size:.8125rem; color:var(--ink-soft); }
  footer p { margin:0; }

  /* ---------- 回到顶部 ---------- */
  .to-top {
    position:fixed; right:20px; bottom:22px; z-index:45;
    width:46px; height:46px; display:grid; place-items:center;
    border-radius:14px; border:1px solid var(--rule); background:var(--sheet); color:var(--accent);
    cursor:pointer; box-shadow:var(--shadow);
    opacity:0; visibility:hidden; transform:translateY(14px) scale(.9);
    transition:opacity 240ms ease, transform 240ms cubic-bezier(.2,.8,.2,1), visibility 240ms, border-color 200ms ease;
  }
  .to-top.show { opacity:1; visibility:visible; transform:none; }
  .to-top:hover { border-color:var(--accent); transform:translateY(-3px); }
  .to-top svg { width:19px; height:19px; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior:auto; }
    .card, #search, select, .dir-btn, .to-top { transition:none; }
    .card:hover, .to-top:hover { transform:none; }
  }
  @media (max-width: 560px) {
    .controls { width:100%; }
    .count { margin-left:0; }
    .grid { grid-template-columns:1fr; }
    .tools { top:10px; right:10px; }
    .scheme-name { display:none; }
    .tool-btn { padding:.5rem; }
    .to-top { right:14px; bottom:14px; }
  }
</style>
</head>
<body>

<div class="topbar" aria-hidden="true"><div class="topbar-fill" id="progressFill"></div></div>

<div class="tools">
  <div class="scheme-wrap">
    <button class="tool-btn" id="schemeBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="选择配色">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.9 1.8-1.9 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.9 1.9-1.9H17a4 4 0 0 0 4-4c0-4.4-4-7.8-9-7.8z"/><circle cx="7.5" cy="11.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="10" cy="7.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="7.5" r="1.1" fill="currentColor" stroke="none"/></svg>
      <span class="scheme-name" id="schemeName">薄荷绿</span>
    </button>
    <div class="scheme-panel" id="schemePanel" role="menu" aria-label="配色选择">
      <div class="sp-label">COLOR SCHEME / 配色</div>
      <div class="scheme-grid" id="schemeGrid">
        <button class="scheme-opt" type="button" data-scheme-opt="mecha"     aria-pressed="false"><i></i><span>机甲冷灰</span></button>
        <button class="scheme-opt" type="button" data-scheme-opt="business"  aria-pressed="false"><i></i><span>商务蓝</span></button>
        <button class="scheme-opt" type="button" data-scheme-opt="china"     aria-pressed="false"><i></i><span>中国红</span></button>
        <button class="scheme-opt" type="button" data-scheme-opt="ali"       aria-pressed="false"><i></i><span>阿里橙</span></button>
        <button class="scheme-opt" type="button" data-scheme-opt="grape"     aria-pressed="false"><i></i><span>葡萄籽</span></button>
        <button class="scheme-opt" type="button" data-scheme-opt="mint"      aria-pressed="false"><i></i><span>薄荷绿</span></button>
        <button class="scheme-opt" type="button" data-scheme-opt="ink"       aria-pressed="false"><i></i><span>墨水风</span></button>
        <button class="scheme-opt" type="button" data-scheme-opt="porcelain" aria-pressed="false"><i></i><span>青花瓷</span></button>
      </div>
    </div>
  </div>
  <button class="tool-btn icon-only" id="themeToggle" type="button" aria-label="切换浅色深色模式">
    <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M4.9 4.9l1.9 1.9M17.2 17.2l1.9 1.9M19.1 4.9l-1.9 1.9M6.8 17.2l-1.9 1.9"/></svg>
    <svg class="ico-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 14.2A8.6 8.6 0 0 1 9.8 3.6a8.6 8.6 0 1 0 10.6 10.6z"/></svg>
  </button>
</div>

<button class="to-top" id="toTop" type="button" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<main class="sheet">

  <header class="hero">
    <div class="hero-line">
      <span class="kicker">VIDEO DIGEST / INDEX</span>
      <span class="stamp" id="stamp">—</span>
    </div>
    <h1>视频摘要库</h1>
    <p class="subtitle">每份摘要都来自一段视频，点击卡片在新窗口打开。</p>
  </header>

  <div class="toolbar">
    <div class="field search-wrap">
      <label for="search">搜索 Search</label>
      <input id="search" type="search" placeholder="按标题、简介或来源筛选…" autocomplete="off">
    </div>
    <div class="controls">
      <div class="field">
        <label for="sortby">排序依据 Sort</label>
        <select id="sortby">
          <option value="date">创建时间</option>
          <option value="name">名称</option>
        </select>
      </div>
      <div class="field">
        <label for="dir">顺序 Order</label>
        <button id="dir" class="dir-btn" type="button" aria-label="切换升序降序">倒序 ↓</button>
      </div>
    </div>
    <div class="count" id="count">—</div>
  </div>

  <div class="grid" id="grid" aria-live="polite"></div>

  <footer><p>本页由 xin-v-study 自动生成与更新。新增摘要后重新运行索引脚本即可同步。</p></footer>

</main>

<script>
  var CARDS = /*__CARD_DATA__*/[];
  var state = { query:'', key:'date', dir:'desc' };

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function render() {
    var q = state.query.trim().toLowerCase();
    var list = CARDS.filter(function (c) {
      if (!q) return true;
      return [c.title, c.desc, c.source].some(function (v) {
        return String(v || '').toLowerCase().indexOf(q) !== -1;
      });
    });

    var factor = state.dir === 'desc' ? -1 : 1;
    list.sort(function (a, b) {
      if (state.key === 'name') return a.title.localeCompare(b.title, 'zh-CN') * factor;
      return (a.ts - b.ts) * factor;
    });

    var grid = document.getElementById('grid');
    document.getElementById('count').textContent = list.length + ' / ' + CARDS.length + ' 份';
    document.getElementById('stamp').textContent = CARDS.length + ' ENTRIES';

    if (!CARDS.length) {
      grid.innerHTML = '<div class="empty"><p>还没有摘要文件。生成一份后运行索引脚本，这里就会出现卡片。</p></div>';
      return;
    }
    if (!list.length) {
      grid.innerHTML = '<div class="empty"><p>没有匹配的摘要，换个关键词试试。</p></div>';
      return;
    }

    grid.innerHTML = list.map(function (c, i) {
      var href = encodeURIComponent(c.file);
      var meta = [];
      if (c.source) meta.push('<span>来源 · ' + escapeHtml(c.source) + '</span>');
      if (c.date) meta.push('<span class="date-mark">' + escapeHtml(c.date) + '</span>');
      if (c.duration && c.duration !== '—') meta.push('<span>' + escapeHtml(c.duration) + '</span>');
      var idx = String(i + 1).padStart(2, '0');
      return '<a class="card" href="' + href + '" target="_blank" rel="noopener">' +
               '<span class="card-index" aria-hidden="true">' + idx + '</span>' +
               '<h2>' + escapeHtml(c.title) + '</h2>' +
               '<p class="desc">' + escapeHtml(c.desc || '（无简介）') + '</p>' +
               '<div class="foot">' + meta.join('') + '</div>' +
             '</a>';
    }).join('');
  }

  document.getElementById('search').addEventListener('input', function (e) {
    state.query = e.target.value;
    render();
  });
  document.getElementById('sortby').addEventListener('change', function (e) {
    state.key = e.target.value;
    render();
  });
  var dirBtn = document.getElementById('dir');
  dirBtn.addEventListener('click', function () {
    state.dir = state.dir === 'desc' ? 'asc' : 'desc';
    dirBtn.textContent = state.dir === 'desc' ? '倒序 ↓' : '正序 ↑';
    render();
  });

  (function () {
    var root = document.documentElement;
    var SCHEMES = {
      mecha:'机甲冷灰', business:'商务蓝', china:'中国红', ali:'阿里橙',
      grape:'葡萄籽', mint:'薄荷绿', ink:'墨水风', porcelain:'青花瓷'
    };
    var schemeBtn = document.getElementById('schemeBtn');
    var schemePanel = document.getElementById('schemePanel');
    var schemeName = document.getElementById('schemeName');
    var opts = [].slice.call(document.querySelectorAll('.scheme-opt'));
    function syncScheme() {
      var cur = root.getAttribute('data-scheme');
      schemeName.textContent = SCHEMES[cur] || cur;
      opts.forEach(function (o) { o.setAttribute('aria-pressed', o.getAttribute('data-scheme-opt') === cur ? 'true' : 'false'); });
    }
    function closePanel() {
      schemePanel.classList.remove('open');
      schemeBtn.setAttribute('aria-expanded', 'false');
    }
    syncScheme();
    schemeBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = schemePanel.classList.toggle('open');
      schemeBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    opts.forEach(function (o) {
      o.addEventListener('click', function (e) {
        e.stopPropagation();
        var s = o.getAttribute('data-scheme-opt');
        root.setAttribute('data-scheme', s);
        try { localStorage.setItem('xvs-scheme', s); } catch (err) {}
        syncScheme();
        closePanel();
      });
    });
    document.addEventListener('click', function (e) {
      if (!schemePanel.contains(e.target) && e.target !== schemeBtn) closePanel();
    });

    var themeBtn = document.getElementById('themeToggle');
    themeBtn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('xvs-theme', next); } catch (err) {}
    });

    var fill = document.getElementById('progressFill');
    var toTop = document.getElementById('toTop');
    var ticking = false;
    function onScroll() {
      var y = window.pageYOffset || document.documentElement.scrollTop || 0;
      var max = document.documentElement.scrollHeight - window.innerHeight;
      fill.style.width = (max > 0 ? Math.min(100, y / max * 100) : 0) + '%';
      toTop.classList.toggle('show', y > 320);
      ticking = false;
    }
    window.addEventListener('scroll', function () {
      if (!ticking) { window.requestAnimationFrame(onScroll); ticking = true; }
    }, { passive: true });
    window.addEventListener('resize', onScroll);
    toTop.addEventListener('click', function () { window.scrollTo({ top:0, behavior:'smooth' }); });
    onScroll();
  })();

  render();
</script>
</body>
</html>
